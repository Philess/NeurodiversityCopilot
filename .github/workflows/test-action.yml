name: Pull request review issues creation
on: 
  pull_request_review:
    types: [submitted]

jobs:
  test_action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - id: label-the-PR
        uses: actions/labeler@v6
      - name: Create issues for PR reviews on neurodiversity-check
        if: contains(steps.label-the-PR.outputs.all-labels, 'neurodiversity-check')
        uses: ./
        with:
          azure_ai_project_endpoint: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}
          model_deployment_name: "gpt-4.1"